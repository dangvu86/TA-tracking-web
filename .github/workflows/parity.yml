name: Daily parity check
on:
  schedule:
    - cron: "20 8 * * 1-5" # 15:20 VN, after the 15:00 final
  workflow_dispatch:
jobs:
  parity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run parity
